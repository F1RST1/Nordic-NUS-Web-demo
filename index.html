<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Nordic UART Console</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f3f3;
      color: #1f1f1f;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    h1 { margin: 0; font-size: 1.65rem; }
    p { color: #616161; line-height: 1.55; }
    .eyebrow { color: #007acc; font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .card { margin-top: 24px; padding: 20px; border: 1px solid #d4d4d4; border-radius: 8px; background: #fff; }
    .connection { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .device-name { margin-top: 6px; font-size: 1.1rem; font-weight: 650; }
    .status { color: #616161; font-size: .9rem; }
    .status[data-connected="true"] { color: #16825d; }
    button, textarea { font: inherit; }
    button {
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      background: #f3f3f3;
      color: #1f1f1f;
      cursor: pointer;
    }
    button:hover:enabled { background: #e8e8e8; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button.primary { border-color: #007acc; background: #007acc; color: #fff; }
    button.primary:hover:enabled { background: #0062a3; }
    textarea {
      display: block;
      width: 100%;
      min-height: 100px;
      margin: 14px 0;
      padding: 12px;
      resize: vertical;
      border: 1px solid #c8c8c8;
      border-radius: 4px;
      outline: none;
      background: #fff;
      color: #1f1f1f;
    }
    textarea:focus { border-color: #007acc; }
    .send-options { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    label { color: #424242; font-size: .9rem; }
    #terminal {
      min-height: 220px;
      max-height: 360px;
      overflow: auto;
      margin: 14px 0 0;
      padding: 14px;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      background: #fafafa;
      color: #1f1f1f;
      font: .9rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .terminal-heading { display: flex; align-items: center; justify-content: space-between; }
    .hint { margin-bottom: 0; font-size: .85rem; }
    @media (max-width: 520px) {
      body { padding: 24px 14px; }
      .connection { align-items: flex-start; flex-direction: column; }
      .send-options { align-items: stretch; flex-direction: column; }
      .send-options button { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">Bluetooth Low Energy</div>
    <h1>Nordic UART Console</h1>
    <p>Connect to a device running the Nordic UART Service (NUS) to send and receive text over Bluetooth LE.</p>
  </header>

  <section class="card connection" aria-label="Bluetooth connection">
    <div>
      <div class="status" id="status" role="status" data-connected="false">Not connected</div>
      <div class="device-name" id="device-name">No device selected</div>
    </div>
    <button class="primary" id="connect-button" type="button">Connect device</button>
  </section>

  <section class="card" aria-labelledby="send-heading">
    <h2 id="send-heading">Send</h2>
    <label for="message">Message</label>
    <textarea id="message" placeholder="Type a message to send over NUS..." disabled></textarea>
    <div class="send-options">
      <label><input id="append-newline" type="checkbox" checked> Append newline</label>
      <button class="primary" id="send-button" type="button" disabled>Send message</button>
    </div>
    <p class="hint">The device chooser lists nearby Bluetooth devices without filtering by advertised name.</p>
  </section>

  <section class="card" aria-labelledby="terminal-heading">
    <div class="terminal-heading">
      <h2 id="terminal-heading">Received data</h2>
      <button id="clear-button" type="button">Clear</button>
    </div>
    <pre id="terminal" aria-live="polite"></pre>
  </section>

  <script src="static/nus.js"></script>
</body>
</html>
